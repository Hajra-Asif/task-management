<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/@icon/themify-icons@1.0.1-alpha.3/themify-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366F1;
            --secondary-color: #4F46E5;
            --text-color: #1F2937;
            --light-text: #6B7280;
            --bg-color: #F9FAFB;
            --section-bg: #FFFFFF;
            --card-bg: #FFFFFF;
            --border-color: #E5E7EB;
            --header-bg: #FFFFFF;
            --sidebar-bg: #111827;
            --sidebar-text: #F3F4F6;
            --hover-color: #4F46E5;
            --input-bg: #F3F4F6;
            --btn-text: #FFFFFF;
            --shadow-color: rgba(0, 0, 0, 0.05);
            --danger-color: #EF4444;
            --success-color: #10B981;
            --warning-color: #F59E0B;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            color: var(--text-color);
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 250px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            padding: 20px;
            transition: width 0.3s ease-in-out;
            overflow: hidden;
        }

        .sidebar a,
        .sidebar p {
            color: var(--sidebar-text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
            cursor: pointer;
        }

        .sidebar a:hover,
        .sidebar p:hover {
            background-color: var(--hover-color);
            color: var(--btn-text);
        }

        .sidebar.collapsed {
            width: 60px;
            padding: 10px;
        }

        .content {
            margin-left: 250px;
            padding: 20px;
            width: calc(100% - 250px);
            transition: margin-left 0.3s ease-in-out, width 0.3s ease-in-out;
        }

        .content.collapsed {
            margin-left: 60px;
            width: calc(100% - 60px);
        }

        .toggle-btn {
            background: var(--primary-color);
            color: var(--btn-text);
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .toggle-btn.collapsed {
            width: 100%;
            text-align: center;
        }

        .updatePassword-label {
            font-size: 18px;
            text-align: left;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        .updatePassword-form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-box {
            width: 100%;
            max-width: 25em;
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .btn1 {
            background-color: var(--primary-color);
            color: var(--btn-text);
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
            max-width: 25em;
            margin-top: 10px;
        }

        .btn1:hover {
            background-color: var(--secondary-color);
        }

        .signInContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 4px 6px var(--shadow-color);
            max-width: 500px;
            margin: 50px auto;
        }

        .SignInInnercontainer {
            width: 100%;
        }

        .upPswd {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        @media (max-width:600px) {
            .dashboardRow {
                display: flex;
                flex-direction: column;
            }
            
            .input-box {
                width: 100%;
            }
            
            .signInContainer {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row dashboardRow d-flex">
            <nav class="sidebar d-flex flex-column" id="sidebar">
                <button class="toggle-btn" id="toggleBtn"><i class="fas fa-bars"></i></button>
                <a href="./dashboard.html"><i class="fas fa-home me-3"></i> Home</a>
                <a href="./profile.html"><i class="fas fa-user me-3"></i> Profile</a>
                <a href="./createBlog.html"><i class="fas fa-plus me-3"></i> Create a blog</a>
                <a href="./bookMark.html"><i class="fas fa-bookmark me-3"></i> Bookmark</a>
                <a href="./updatePassword.html"><i class="fas fa-lock me-3"></i> Update Password</a>
                <p id="logoutBtn"><i class="fas fa-sign-out-alt me-3"></i> Logout</p>
            </nav>
            <div class="content" id="content">
                <div class="container">
                    <main class="upPswd">
                        <div class="signInContainer flex-column">
                            <h2 class="mb-5 text-center">Update Password</h2>
                            <form id="passwordForm" class="SignInInnercontainer">
                                <div class="updatePassword-form-group">
                                    <label class="updatePassword-label" for="currentPassword">Current Password</label>
                                    <input class="input-box" type="password" id="currentPassword"
                                        placeholder="Enter your Current Password..." required>
                                </div>
                                <div class="updatePassword-form-group">
                                    <label class="updatePassword-label" for="newPassword">New Password</label>
                                    <input class="input-box" type="password" id="newPassword"
                                        placeholder="Enter your New Password..." required>
                                </div>
                                <div class="updatePassword-form-group">
                                    <label class="updatePassword-label" for="confirmPassword">Confirm New
                                        Password</label>
                                    <input class="input-box" type="password" id="confirmPassword"
                                        placeholder="Enter your Confirm New Password..." required>
                                </div>
                                <button id="updatePasswordBtn" type="button" class="btn1">Update Password</button>
                            </form>
                        </div>
                    </main>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('toggleBtn').addEventListener('click', function () {
            let sidebar = document.getElementById('sidebar');
            let content = document.getElementById('content');

            if (sidebar && content) { // Ensure elements exist before accessing them
                sidebar.classList.toggle('collapsed');
                content.classList.toggle('collapsed');
            } else {
                console.error("Sidebar or content element not found!");
            }
        });
    </script>
</body>
</html>
