<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366F1;
            --secondary-color: #0f0f0f;
            --text-color: #333333;
            --light-text: #777777;
            --bg-color: #ffffff;
            --section-bg: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #e5e5e5;
            --header-bg: #ffffff;
            --footer-bg: #0f0f0f;
            --footer-text: #ffffff;
            --hover-color: #4F46E5;
            --input-bg: #f5f5f5;
            --btn-text: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }


        body {
            min-height: 100vh;
            background: var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-section {
            display: flex;
            flex-wrap: wrap;
            background: #fff;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
            max-width: 1000px;
            width: 100%;
        }

        .form-left {
            background: #2b2b2b;
            color: white;
            padding: 3rem;
            flex: 1 1 50%;
        }

        .form-right {
            background: var(--primary-color);
            color: white;
            padding: 3rem;
            flex: 1 1 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .form-left h3 {
            color: #fff;
        }

        .form-control {
            background: #343434;
            border: none;
            color: #fff;
        }

        .form-control:focus {
            background: #444;
            color: #fff;
        }

        .btn-primary {
            background: var(--primary-color);
            border: none;
        }

        .btn-primary:hover {
            background: var(--card-bg);
            color: var(--footer-bg);
        }
        .google-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #dadce0;
  border-radius: 4px;
  padding: 10px 15px;
  background-color: #fff;
  color: #3c4043;
  font-size: 16px;
  font-weight: 500;
  font-family: 'Roboto', sans-serif;
  cursor: pointer;
  width: 100%;
  transition: box-shadow 0.2s ease;
}

.google-btn:hover {
            box-shadow: 0 1px 3px var(--hover-color),
                0 4px 8px var(--hover-color);
        }

.google-icon {
  height: 20px;
  width: 20px;
  margin-right: 10px;
}


        @media (max-width: 768px) {
            .form-section {
                flex-direction: column;
            }

            .form-left,
            .form-right {
                flex: 1 1 100%;
                padding: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="form-section">
        <div class="form-left">
            <h3 class="text-center mb-4">Register</h3>
            <form id="loginform">

                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Login</button>
                <h6 class="py-3 text-center">OR</h6>
                <button type="button" id="google" class="google-btn">
                    <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo" class="google-icon" />
                    <span>Continue with Google</span>
                  </button>
                <p class="pt-3">Don't have an account ? <a href="./pages/signup.html">Sign up</a></p>
            </form>
        </div>
        <div class="form-right">
            <h1>Welcome to <br><strong>Task management</strong></h1>
            <p>Login to access your account</p>
            <img src="../assets/images/lll.svg" alt="Student Illustration" class="img-fluid mt-4"
                style="max-height: 300px;">
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
    <script src="./javascript/login.js" type="module"></script>
</body>

</html>
